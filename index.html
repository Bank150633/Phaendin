<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DEALTHAI MOVIES</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
}

header{
    background:#000;
    padding:20px;
    text-align:center;
}

.logo{
    font-size:30px;
    color:red;
    font-weight:bold;
}

.search{
    margin-top:20px;
    padding:12px;
    width:80%;
    border-radius:20px;
    border:0;
}

.container{
    padding:20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
}

.card{
    background:#222;
    padding:15px;
    border-radius:15px;
}

.card img{
    width:100%;
    border-radius:10px;
}

button{
    background:red;
    color:white;
    border:0;
    padding:10px;
    border-radius:20px;
}

</style>

</head>


<body>


<header>

<div class="logo">
🎬 DEALTHAI MOVIES
</div>

<input class="search" placeholder="ค้นหาหนัง">

</header>



<div class="container">


<div class="card">

<img src="https://upload.wikimedia.org/wikipedia/en/9/9a/Night_of_the_Living_Dead_%281968%29.jpg">

<h3>
Night of the Living Dead
</h3>

<p>
1968 | Horror
</p>

<button>
▶ ดูหนัง
</button>

</div>



<div class="card">

<img src="https://upload.wikimedia.org/wikipedia/commons/5/5c/The_General_%281926_film_poster%29.jpg">

<h3>
The General
</h3>

<p>
1926 | Comedy
</p>

<button>
▶ ดูหนัง
</button>

</div>


</div>


</body>
</html>
